<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U APFS</title>
<style>
  :root{
    --bg:#111318; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e8ebf0; --dim:#98a1b0; --accent:#4c8dff; --ok:#3ecf8e; --warn:#f2b447; --bad:#f06a6a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 24px 80px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:11px 13px;color:var(--fg);font-size:14px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 18px;
    font-size:14px;cursor:pointer;font-weight:500}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  .hint{color:var(--dim);font-size:13px;margin-top:10px}
  .title{font-size:14px;color:var(--dim);margin:0 0 12px;letter-spacing:.3px}
  .item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:10px;
    background:var(--panel2);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
  .item:hover{border-color:var(--line)}
  .item .name{font-weight:600}
  .tag{font-size:12px;padding:2px 8px;border-radius:6px;background:#232833;color:var(--dim)}
  .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel)}
  td{padding:10px 10px;border-bottom:1px solid #26303a;font-variant-numeric:tabular-nums}
  tr.dir td{cursor:pointer;color:#cfe0ff}
  tr.dir:hover td{background:#1b2130}
  tr.file td{cursor:pointer}
  tr.file:hover td{background:#181d27}
  .crumb{color:var(--dim);font-size:13px;margin-bottom:10px;word-break:break-all}
  .crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
  .empty{color:var(--dim);padding:22px;text-align:center}
  .err{background:#2a1c1f;border:1px solid #5b2a2f;color:#f2b0b0;padding:12px 14px;border-radius:9px;
    font-size:13px;margin-top:12px;white-space:pre-wrap}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:30px}
  .sp{flex:none}
  .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:8px;vertical-align:middle}
  .dot.dir{background:#4c8dff}
  .dot.file{background:#6b7887}
</style>
</head>
<body>
<div class="wrap">
  <h1>U APFS</h1>
  <div class="sub">只读浏览 APFS 磁盘 · 不写盘 · 隐藏项自动隐藏 <span id="ver"></span></div>

  <div class="card">
    <div class="title">第一步：选择磁盘或镜像</div>
    <div class="row">
      <input id="path" type="text" placeholder="例如 /dev/sdb、/dev/disk2s2、~/Desktop/test.dmg">
      <button id="scanBtn">扫描</button>
    </div>
    <div class="hint">Linux 上未挂载的盘一般是 /dev/sdX 或 /dev/nvme0n1；macOS 上是 /dev/disk2 或 /dev/disk2s2。读整块盘需要管理员权限，请用有权限的方式启动。</div>
    <div id="scanErr"></div>
    <div id="parts" style="margin-top:14px"></div>
  </div>

  <div class="card" id="volCard" style="display:none">
    <div class="title">第二步：选择卷</div>
    <div id="vols"></div>
  </div>

  <div class="card" id="browseCard" style="display:none">
    <div class="title">第三步：浏览文件</div>
    <div class="row" style="margin-bottom:12px">
      <input id="kw" type="text" placeholder="在当前卷里搜索文件名">
      <button id="searchBtn" class="ghost">搜索</button>
      <button id="rootBtn" class="ghost">回根目录</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <div id="listBox"></div>
    <div id="listErr"></div>
  </div>

  <div class="foot">版本 <span id="ver2"></span> · 只读，不改动原盘</div>
</div>

<script>
const S = { path:"", off:0, size:0, oid:0, name:"", p:"/", snap:0 };
const $ = id => document.getElementById(id);

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function human(n){ if(n==null) return ""; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++;} return (i===0?n:n.toFixed(1))+" "+u[i]; }
function tstr(t){ if(!t) return ""; const d=new Date(t*1000); return isNaN(d)? "" : d.toLocaleString("zh-CN",{hour12:false}); }
function fail(box, msg){ box.innerHTML=""; const d=el("div","err", msg); box.appendChild(d); }
async function api(url, params){
  const q = new URLSearchParams(params||{}).toString();
  const r = await fetch(url + (q? "?"+q : ""));
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "未知错误");
  return j.data;
}

async function scan(){
  $("parts").innerHTML=""; $("scanErr").innerHTML="";
  $("volCard").style.display="none"; $("browseCard").style.display="none";
  const path = $("path").value.trim();
  if(!path){ fail($("scanErr"), "请先填写磁盘路径或镜像文件路径"); return; }
  $("scanBtn").disabled = true; $("scanBtn").textContent="扫描中…";
  try{
    const d = await api("/api/scan", {path});
    S.path = d.path; S.size = d.size;
    if(!d.parts.length){ fail($("parts"), "没有发现可用分区"); return; }
    const box = el("div");
    box.appendChild(el("div","hint","分区表：" + d.table + " · 总大小 " + human(d.size)));
    d.parts.forEach(p=>{
      const it = el("div","item");
      const left = el("div");
      left.appendChild(el("div","name", p.label || ("分区 #"+(p.index+1))));
      left.appendChild(el("div","hint", "偏移 " + human(p.off) + " · 大小 " + human(p.size)));
      const right = el("div","row");
      if(p.apfs){
        right.appendChild(el("span","tag ok","APFS"));
        if(p.volumes && p.volumes.length) right.appendChild(el("span","tag", p.volumes.join(" / ")));
        it.onclick = ()=> openVols(p.off, p.size);
      }else{
        right.appendChild(el("span","tag", p.guid ? p.guid.slice(0,8) : (d.table||"")));
        it.style.cursor="default";
      }
      it.appendChild(left); it.appendChild(right);
      box.appendChild(it);
    });
    $("parts").appendChild(box);
  }catch(e){ fail($("scanErr"), e.message); }
  finally{ $("scanBtn").disabled=false; $("scanBtn").textContent="扫描"; }
}

async function openVols(off, size){
  $("volCard").style.display=""; $("vols").innerHTML="<div class='empty'>正在读取卷…</div>";
  try{
    const d = await api("/api/volumes", {path:S.path, off, size});
    S.off = off; S.size = size;
    $("vols").innerHTML="";
    if(!d.volumes.length){ $("vols").innerHTML="<div class='empty'>这块分区里没有可读的 APFS 卷</div>"; return; }
    d.volumes.forEach(v=>{
      const it = el("div","item");
      const left = el("div");
      left.appendChild(el("div","name", v.name || "(未命名卷)"));
      left.appendChild(el("div","hint", (v.role||"数据卷") ));
      const right = el("div","row");
      if(v.sealed) right.appendChild(el("span","tag ok","密封"));
      if(v.encrypted) right.appendChild(el("span","tag warn","加密"));
      if(!v.usable) right.appendChild(el("span","tag bad","不可用"));
      if(v.encrypted){
        it.appendChild(left); it.appendChild(right); $("vols").appendChild(it); return;
      }
      it.onclick = ()=> browse(v.oid, v.name, "/");
      it.appendChild(left); it.appendChild(right);
      $("vols").appendChild(it);
    });
  }catch(e){ $("vols").innerHTML=""; fail($("vols"), e.message); }
}

function crumb(path){
  const box = $("crumb"); box.innerHTML="";
  const root = el("a",null,"/（根目录）");
  root.onclick = ()=> browse(S.oid, S.name, "/");
  box.appendChild(root);
  if(path !== "/"){
    box.appendChild(document.createTextNode("  ›  " + path.slice(1)));
  }
}

async function browse(oid, name, path){
  S.oid = oid; S.name = name; S.p = path;
  $("browseCard").style.display="";
  crumb(path);
  $("listErr").innerHTML="";
  $("listBox").innerHTML="<div class='empty'>正在读取目录…</div>";
  const t0 = Date.now();
  try{
    const d = await api("/api/list", {path:S.path, off:S.off, size:S.size, oid, p:path, snap:S.snap});
    const box = $("listBox"); box.innerHTML="";
    const info = el("div","hint", "共 " + d.entries.length + " 项 · 用时 " + (Date.now()-t0) + " ms");
    box.appendChild(info);
    if(!d.entries.length){ const e=el("div","empty","这个目录是空的"); box.appendChild(e); return; }
    const t = el("table");
    const head = el("tr");
    ["名称","类型","大小","修改时间",""].forEach(h=> head.appendChild(el("th",null,h)));
    t.appendChild(head);
    d.entries.forEach(e=>{
      const tr = el("tr", e.is_dir? "dir":"file");
      const tdName = el("td");
      if(e.is_dir){ const dot=el("span","dot dir"); tdName.appendChild(dot); }
      else { const dot=el("span","dot file"); tdName.appendChild(dot); }
      tdName.appendChild(document.createTextNode(e.name));
      const tdType = el("td", null, e.is_dir? "目录":"文件");
      const tdSize = el("td", null, e.is_dir? "" : human(e.size));
      const tdTime = el("td", null, tstr(e.mtime));
      const tdAct  = el("td");
      const full = (path==="/"? "" : path) + "/" + e.name;
      if(e.is_dir){
        tr.onclick = ()=> browse(S.oid, S.name, full);
      }else{
        const a = el("a",null,"下载");
        a.href = "api/file?" + new URLSearchParams({path:S.path, off:S.off, size:S.size, oid:S.oid, p:full, snap:S.snap});
        a.style.color = "var(--accent)";
        tdAct.appendChild(a);
        tr.ondblclick = ()=> a.click();
      }
      tr.appendChild(tdName); tr.appendChild(tdType); tr.appendChild(tdSize); tr.appendChild(tdTime);
      tr.appendChild(tdAct);
      t.appendChild(tr);
    });
    box.appendChild(t);
  }catch(e){ $("listBox").innerHTML=""; fail($("listErr"), "读取这个目录失败：" + e.message); }
}

async function search(){
  const q = $("kw").value.trim();
  if(!q){ return; }
  $("listErr").innerHTML="";
  $("listBox").innerHTML="<div class='empty'>正在搜索…</div>";
  try{
    const d = await api("/api/search", {path:S.path, off:S.off, size:S.size, oid:S.oid, q});
    const box = $("listBox"); box.innerHTML="";
    box.appendChild(el("div","hint","匹配 " + d.hits.length + " 项（最多显示 200 条）"));
    if(!d.hits.length){ box.appendChild(el("div","empty","没有找到匹配的文件")); return; }
    d.hits.forEach(h=>{
      const it = el("div","item");
      const left = el("div");
      const nmLine = el("div","name");
      const nmDot = el("span", h.is_dir? "dot dir":"dot file"); nmLine.appendChild(nmDot); nmLine.appendChild(document.createTextNode(h.name));
      left.appendChild(nmLine);
      left.appendChild(el("div","hint", h.path + (h.is_dir? "" : " · " + human(h.size))));
      if(h.is_dir){
        const go = el("button","ghost","打开目录");
        go.onclick = ()=> browse(S.oid, S.name, h.path);
        it.appendChild(left); it.appendChild(go);
      }else{
        const a = el("a",null,"下载");
        a.href = "api/file?" + new URLSearchParams({path:S.path, off:S.off, size:S.size, oid:S.oid, p:h.path});
        a.style.color="var(--accent)";
        it.appendChild(left); it.appendChild(a);
      }
      box.appendChild(it);
    });
  }catch(e){ $("listBox").innerHTML=""; fail($("listErr"), e.message); }
}

$("scanBtn").onclick = scan;
$("searchBtn").onclick = search;
$("rootBtn").onclick = ()=> browse(S.oid, S.name, "/");
$("path").addEventListener("keydown", e=>{ if(e.key==="Enter") scan(); });
$("kw").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
fetch("/api/sys").then(r=>r.json()).then(j=>{
  if(j.ok){ $("ver").textContent = "· " + j.data.os + "/" + j.data.arch; $("ver2").textContent = j.data.version; }
}).catch(()=>{});
</script>
</body>
</html>
